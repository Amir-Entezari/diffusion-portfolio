# Controlled simulation assumptions, not fitted market estimates.
# 8,000 weekdays: 5,000 / 1,500 / 1,500 observations; 4,940 / 1,500 / 1,500 windows.
# Source seed stays fixed when varying the independent model-training seed.
# Loadings/idio/drift use the documented simulator defaults; no risk-free series is modeled.
seed: 42
data:
  dataset: synthetic_gaussian
  frequency: daily
  sample_start: '1990-01-01'
  sample_end: '2020-08-28'
  train_end: '2009-02-27'
  val_end: '2014-11-28'
  lookback: 60
  horizon: 1
  return_scaling: train_zscore
  subtract_risk_free: false
  max_gap_days: 7
  source_options:
    n_assets: 12
    n_observations: 8000
    n_factors: 2
    seed: 42
    start_date: '1990-01-01'
model:
  type: conditional_diffusion
  condition_dim: 128
  history_hidden_dim: 256
  diffusion_steps: 100
  schedule: cosine
  prediction_type: v_prediction
  time_embed_dim: 128
  channels:
  - 32
  - 64
  - 128
  n_res_blocks: 1
training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  gradient_clip_norm: 1.0
  validation_seed: 12345
portfolio:
  optimizer: mean_variance
  allow_short: false
  transaction_cost_bps: 10.0
  annualization_factor: 252
evaluation:
  n_scenarios: 256
  report_distribution_metrics: true
  report_portfolio_metrics: true
