# Validated MLP baseline settings with the matched high-dimensional data definition.
seed: 42

data:
  dataset: ken_french_100_size_bm
  frequency: daily

  sample_start: "1958-01-01"
  sample_end: "2023-12-31"

  train_end: "1999-12-31"
  val_end: "2004-12-31"

  lookback: 60
  horizon: 1
  # Each segment needs a new lookback; no window may bridge a long data outage.
  max_gap_days: 7

  return_scaling: train_zscore
  subtract_risk_free: true
  # Explicit complete-panel policy: drop whole dates with French missing sentinels.
  # The loader warns with counts/date range; lookback counts retained observations.
  source_options:
    missing_policy: drop

model:
  type: conditional_diffusion

  condition_dim: 128
  history_hidden_dim: 256

  diffusion_steps: 100
  schedule: cosine
  prediction_type: v_prediction

  time_embed_dim: 128
  channels: [32, 64, 128]
  n_res_blocks: 1

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001

  gradient_clip_norm: 1.0
  validation_seed: 12345

portfolio:
  optimizer: mean_variance
  allow_short: false
  transaction_cost_bps: 10.0
  annualization_factor: 252

evaluation:
  n_scenarios: 256
  report_distribution_metrics: true
  report_portfolio_metrics: true
