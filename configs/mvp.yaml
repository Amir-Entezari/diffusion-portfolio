seed: 42

data:
  dataset: ken_french_12
  frequency: daily

  sample_start: "1958-01-01"
  sample_end: "2023-12-31"

  train_end: "1999-12-31"
  val_end: "2004-12-31"

  lookback: 60
  horizon: 1
  
  return_scaling: train_zscore

model:
  type: conditional_diffusion
  condition_dim: 128
  diffusion_steps: 100
  schedule: cosine
  channels: [32, 64, 128]

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001

portfolio:
  optimizer: mean_variance
  allow_short: false
  transaction_cost_bps: 10.0
  annualization_factor: 252

evaluation:
  n_scenarios: 256
  report_distribution_metrics: true
  report_portfolio_metrics: true
